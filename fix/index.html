<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdant Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one centered column. A glass brand pill, then a row with the card deck in the middle and a round arrow on each side, then a frosted console holding the active tree's description, classification and dots. */
:root{
  --bg:#e7efe4; --bg-2:#d0e3d4;
  --ink:#12261b; --ink-soft:#3d5a48;
  --accent:#047857;
  --glass:rgba(255,255,255,.42); --glass-hi:rgba(255,255,255,.62);
  --glass-line:rgba(255,255,255,.78); --glow:rgba(16,185,129,.4);
  --shadow:rgba(10,60,35,.38);
  --blob-a:#34d399; --blob-b:#a3c4a0; --blob-c:#2f7a57; --blob-op:.55;
  --font-display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(200px,min(calc(100vw - 148px),calc((100dvh - 330px) * .75)),336px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08140e; --bg-2:#0e2418;
    --ink:#e8f5ec; --ink-soft:#a6c4b1;
    --accent:#34d399;
    --glass:rgba(18,52,38,.42); --glass-hi:rgba(34,86,62,.5);
    --glass-line:rgba(170,240,205,.26); --glow:rgba(52,211,153,.36);
    --shadow:rgba(0,0,0,.65);
    --blob-a:#10b981; --blob-b:#4d7c63; --blob-c:#14532d; --blob-op:.5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08140e; --bg-2:#0e2418;
  --ink:#e8f5ec; --ink-soft:#a6c4b1;
  --accent:#34d399;
  --glass:rgba(18,52,38,.42); --glass-hi:rgba(34,86,62,.5);
  --glass-line:rgba(170,240,205,.26); --glow:rgba(52,211,153,.36);
  --shadow:rgba(0,0,0,.65);
  --blob-a:#10b981; --blob-b:#4d7c63; --blob-c:#14532d; --blob-op:.5;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:linear-gradient(160deg,var(--bg),var(--bg-2));color:var(--ink);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ambient light behind the glass */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-op);animation:drift 24s ease-in-out infinite alternate}
.b1{width:min(70vw,520px);aspect-ratio:1;left:-12%;top:-8%;background:var(--blob-a)}
.b2{width:min(80vw,600px);aspect-ratio:1;right:-18%;top:32%;background:var(--blob-b);animation-duration:30s}
.b3{width:min(60vw,460px);aspect-ratio:1;left:8%;bottom:-14%;background:var(--blob-c);animation-duration:27s}
@keyframes drift{to{transform:translate(44px,-34px) scale(1.12)}}

.app{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:clip}
main{width:100%;display:flex;flex-direction:column;align-items:center;min-width:0}

/* glass surface */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 24px 48px -28px var(--shadow),0 0 34px -10px var(--glow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 45%);pointer-events:none}

.brand{display:inline-flex;align-items:center;gap:9px;padding:8px 16px 8px 12px;border-radius:999px;color:var(--accent)}
.brand h1{margin:0;font:600 14px/1 var(--font-display);letter-spacing:.04em;color:var(--ink)}
.brand svg{width:18px;height:18px;flex:none}

/* slider row: arrow, deck, arrow */
.row{display:grid;grid-template-columns:40px var(--cw) 40px;align-items:start;justify-content:center;gap:10px}
.row .nav{margin-top:calc(var(--cw) * .6667 - 20px)}
.stage{width:var(--cw);padding-bottom:30px;touch-action:pan-y;user-select:none;-webkit-user-select:none;border-radius:32px}
.stage:focus-visible{outline:2px solid var(--accent);outline-offset:10px}
.stack{position:relative;width:100%;aspect-ratio:3/4}
.card{position:absolute;inset:0;border-radius:30px;overflow:hidden;background:var(--bg-2);border:1px solid var(--glass-line);box-shadow:0 30px 46px -26px var(--shadow);cursor:grab;transform-origin:50% 92%;will-change:transform;z-index:calc(10 - var(--d,0));transition:transform .6s cubic-bezier(.22,.9,.24,1),opacity .45s ease,box-shadow .6s ease}
.card:active{cursor:grabbing}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card::before{content:"";position:absolute;inset:0;background:#06231a;opacity:calc(var(--d,0) * .2);z-index:2;pointer-events:none;transition:opacity .5s ease}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,rgba(255,255,255,.4),rgba(255,255,255,0) 38%),linear-gradient(0deg,rgba(6,40,24,.3),rgba(6,40,24,0) 30%);pointer-events:none;z-index:1}
.card[data-depth="0"]{--d:0;transform:none;box-shadow:0 36px 56px -26px var(--shadow),0 0 0 1px rgba(255,255,255,.35),0 0 46px -10px var(--glow)}
.card[data-depth="1"]{--d:1;transform:translate(-14px,14px) rotate(-5deg) scale(.95)}
.card[data-depth="2"]{--d:2;transform:translate(16px,26px) rotate(5.5deg) scale(.9)}
.card[data-depth="3"]{--d:3;transform:translate(0,34px) rotate(-2deg) scale(.86);opacity:0;pointer-events:none}
.card.leaving{transform:translate(calc(var(--dir,-1) * 125%),-34px) rotate(calc(var(--dir,-1) * 16deg));opacity:0;z-index:20;pointer-events:none;transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .5s ease .05s}
.card.leaving::before{opacity:0}
.card.entering{transform:translate(calc(var(--dir,-1) * 125%),-34px) rotate(calc(var(--dir,-1) * -16deg));opacity:0;z-index:20}
.card.dragging{transition:none}
.card.snap{transition:none!important}
.idx{position:absolute;left:14px;top:14px;z-index:3;padding:5px 11px;border-radius:999px;font:600 11.5px/1 var(--font-display);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:#fff;background:rgba(8,42,26,.34);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.nav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -12px var(--shadow),0 0 18px -6px var(--glow);cursor:pointer;transition:transform .2s ease,box-shadow .25s ease}
.nav svg{width:18px;height:18px}
.nav:hover{transform:scale(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 22px -12px var(--shadow),0 0 24px -2px var(--glow)}
.nav:active{transform:scale(.94)}
.nav:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.hint{margin:0 0 16px;font-size:12.5px;color:var(--ink-soft);text-align:center}

/* console */
.console{width:min(100%,calc(var(--cw) + 100px));border-radius:28px;padding:20px 20px 16px}
.info{display:grid}
.item{grid-area:1/1;min-width:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.item.active{opacity:1;visibility:visible;transition:opacity .3s ease .1s,visibility 0s}
.item>*{margin:0;opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .5s cubic-bezier(.22,.9,.24,1)}
.item.active>*{opacity:1;transform:none}
.item.active>:nth-child(1){transition-delay:.14s}
.item.active>:nth-child(2){transition-delay:.2s}
.item.active>:nth-child(3){transition-delay:.27s}
.item.active>:nth-child(4){transition-delay:.34s}
.latin{font:600 12px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.title{font:700 clamp(22px,6vw,27px)/1.15 var(--font-display);letter-spacing:-.01em;margin-top:2px!important;text-wrap:balance}
.desc{margin-top:8px!important;font-size:14.5px;line-height:1.55;color:var(--ink-soft);max-width:62ch}

.class{margin-top:14px!important;padding:12px 14px 14px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--glass-line)}
.class h3{margin:0 0 10px;font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.class dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.class dl div{min-width:0}
.class dt{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.class dd{margin:3px 0 0;font:500 13.5px/1.3 var(--font-body);color:var(--ink);overflow-wrap:anywhere}
.class .sp{grid-column:1/-1;padding-top:9px;border-top:1px solid var(--glass-line)}
.class .sp dd{font-style:italic;font-weight:600;color:var(--accent)}

.controls{display:flex;align-items:center;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-line)}
.dots{display:flex;gap:9px;align-items:center;min-height:30px}
.dot{position:relative;width:8px;height:8px;border:0;padding:0;border-radius:99px;background:var(--ink-soft);opacity:.4;cursor:pointer;transition:width .35s cubic-bezier(.22,.9,.24,1),opacity .3s ease,background .3s ease}
.dot::after{content:"";position:absolute;inset:-12px -4px}
.dot[aria-current="true"]{width:26px;background:var(--accent);opacity:1;box-shadow:0 0 12px var(--glow)}

@media (prefers-reduced-motion: reduce){
  .blob{animation:none}
  .card{transition:opacity .2s ease}
  .item>*{transform:none!important;transition:opacity .2s ease}
}
</style>

<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="app">
  <header>
    <div class="brand glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4C10 4 4 9 4 15c0 2 .8 3.6 2 4.6C7.4 20.6 9 21 10.5 21 17 21 20 14 20 4Z"/><path d="M4 20c3-5 6.5-8.5 11-11"/></svg>
      <h1>Zona pangan dan produktif</h1>
    </div>
  </header>

  <main>
    <div class="row">
      <button class="nav" id="prev" type="button" aria-label="Previous tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Tree cards. Use the left and right arrow keys to change tree.">
        <div class="stack" id="stack"></div>
      </div>
      <button class="nav" id="next" type="button" aria-label="Next tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <p class="hint">Drag a card away, or use the arrows</p>

    <section class="console glass" aria-label="About this tree">
      <div class="info" id="info"></div>
      <div class="controls"><div class="dots" id="dots"></div></div>
    </section>
  </main>
</div>
<p class="sr" id="live" aria-live="polite"></p>

<script>
(function(){
  var f1=function(n){return Math.round(n*10)/10;};

  /* ---------- content ---------- */
  var plants=[
    {title:'Pucuk Merah',latin:'Brush Cherry',img:'images/pucuk-merah.jpeg',alt:'Brush cherry tree with reddish new shoots',
     desc:'Tanaman perdu atau pohon kecil hias yang sangat populer ditanam di pekarangan rumah, taman kota, tepi jalan, dan pagar hidup. Tanaman ini berasal dari famili yang sama dengan jambu-jambuan (Myrtaceae) dan terkenal karena keindahan daun mudanya yang berwarna merah mencolok sebelum berubah menjadi hijau tua.',
     cls:[['Kingdom','Plantae'],['Division','Magnoliophyta'],['Class','Magnoliopsida'],['Order','Myrtales'],['Family','Myrtaceae'],['Genus','Syzygium'],['Species','Syzygium oleana']]},
    {title:'Pohon Ketapang',latin:'Tropical Almond',img:'images/katapang.jpeg',alt:'Tropical almond tree with tiered branches',
     desc:'Pohon besar peneduh yang biasa tumbuh di daerah tropis, terutama di kawasan pesisir pantai. Pohon ini dikenal sangat rindang dengan tajuk daun yang melebar dan bertingkat-tingkat, sehingga sering dimanfaatkan sebagai pohon pelindung di tepi jalan, taman kota, atau area parkir.',
     cls:[['Kingdom','Plantae'],['Division','Magnoliophyta'],['Class','Spermatophyta'],['Order','Myrtales'],['Family','Combretaceae'],['Genus','Terminalia'],['Species','Terminalia catappa L.']]},
    {title:'Alpukat',latin:'Avocado',img:'images/Alpukat.jpg',alt:'Avocados hanging from the tree',
     desc:'Tanaman buah tahunan yang berasal dari wilayah Amerika Tengah dan Amerika Selatan (Meksiko dan Amerika Tengah). Pohon ini dibudidayakan secara luas di berbagai belahan dunia, termasuk di daerah tropis dan subtropis, karena buahnya yang kaya akan nutrisi, bertekstur lembut, serta memiliki kandungan lemak baik yang tinggi.',
     cls:[['Kingdom','Plantae'],['Division','Magnoliophyta'],['Class','Magnoliopsida'],['Order','Laurales'],['Family','Lauraceae'],['Genus','Persea'],['Species','Persea americana Mill.']]},
    {title:'Mangga',latin:'Mango',img:'images/mangga.jpg',alt:'Green mangoes hanging among the leaves',
     desc:'Tanaman buah tahunan berbatang keras yang berasal dari wilayah sekitar perbatasan India dan Myanmar, lalu menyebar luas ke seluruh kawasan Asia Tenggara dan daerah tropis lainnya. Pohon ini menjadi salah satu tanaman pekarangan dan kebun yang paling populer karena buahnya yang manis, segar, serta tajuknya yang rimbun untuk peneduh.',
     cls:[['Kingdom','Plantae'],['Division','Tracheophyta'],['Class','Magnoliopsida'],['Order','Sapindales'],['Family','Anacardiaceae'],['Genus','Mangifera L.'],['Species','Mangifera indica L.']]},
    {title:'Sawo',latin:'Sapodilla',img:'images/Pohon-Sawo.jpg',alt:'Sapodilla tree with brown fruit among dark leaves',
     desc:'Tanaman buah tahunan berbatang keras yang berasal dari wilayah Amerika Tengah (Meksiko), Belize, dan Amerika Utara bagian tropis. Tanaman ini telah lama beradaptasi dan dibudidayakan secara luas di berbagai negara tropis, termasuk Indonesia, karena buahnya yang manis legit dan pohonnya yang rindang.',
     cls:[['Kingdom','Plantae'],['Division','Tracheophyta'],['Class','Magnoliopsida'],['Order','Ericales'],['Family','Sapotaceae'],['Genus','Manilkara'],['Species','Manilkara zapota (L.) P. Royen']]},
    {title:'Jambu Air',latin:'Water Apple',img:'images/jambu-air.jpg',alt:'Water apple branches with red fruit',
     desc:'Tanaman buah tahunan dari suku jambu-jambuan (Myrtaceae) yang berasal dari kawasan Asia Tenggara (termasuk Indonesia dan Malaysia). Pohon ini sangat populer ditanam di pekarangan rumah karena perawatannya yang mudah, cepat berbuah, serta menghasilkan buah dengan kandungan air melimpah dan rasa yang segar.',
     cls:[['Kingdom','Plantae'],['Division','Tracheophyta'],['Class','Magnoliopsida'],['Order','Myrtales'],['Family','Myrtaceae'],['Genus','Syzygium'],['Species','Syzygium aqueum']]},
    {title:'About us',latin:'kelompok 4 12.1',img:'images/kelompok4.jpeg',alt:'',
     desc:'Kami adalah Kelompok 4 kelas 12.1. Selama satu minggu, kami berdiskusi dan bertukar ide untuk menentukan strategi peletakan elemen agar tampilan proyek ini tertata, nyaman dilihat, dan eye-catching. Dari menyusun ide hingga memilih penempatan yang tepat, setiap diskusi menjadi bagian dari perjalanan kolaborasi kami untuk menghadirkan hasil yang menarik dan mudah dinikmati.',
     cls:[['Ketua','Raditya andra'],['Sekretaris','M.Zaky'],['Bendahara','Fadlurohman'],['Tim Kreatif','Rafi Alyandra'],['','KELOMPOK 4'],]}
  ];

  /* ---------- deck logic ---------- */
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR=reduce?80:600;
  var stack=document.getElementById('stack'),info=document.getElementById('info'),dots=document.getElementById('dots'),
      live=document.getElementById('live'),stage=document.getElementById('stage');
  var n=plants.length,active=0,busy=false;
  var pad=function(i){return String(i+1).padStart(2,'0');};

  var cards=plants.map(function(p,i){
    var el=document.createElement('div');
    el.className='card';
    el.innerHTML='<span class="idx">'+pad(i)+' / '+pad(n-1)+'</span><img src="'+p.img+'" alt="'+p.alt+'" draggable="false">';
    stack.appendChild(el);
    return el;
  });
  var items=plants.map(function(p){
    var el=document.createElement('article');
    el.className='item';
    var rows=p.cls.map(function(c,i){
      return '<div'+(i===p.cls.length-1?' class="sp"':'')+'><dt>'+c[0]+'</dt><dd>'+c[1]+'</dd></div>';
    }).join('');
    el.innerHTML='<p class="latin">'+p.latin+'</p><h2 class="title">'+p.title+'</h2><p class="desc">'+p.desc+'</p>'+
      '<section class="class"><h3>Botanical classification</h3><dl>'+rows+'</dl></section>';
    info.appendChild(el);
    return el;
  });
  var dotEls=plants.map(function(p,i){
    var b=document.createElement('button');
    b.type='button';b.className='dot';b.setAttribute('aria-label','Show '+p.title);
    b.addEventListener('click',function(){go(i,i>active?'out':'in',-1);});
    dots.appendChild(b);
    return b;
  });

  function layout(){
    cards.forEach(function(c,i){c.dataset.depth=Math.min(3,(i-active+n)%n);});
    items.forEach(function(it,i){
      var on=i===active;
      it.classList.toggle('active',on);
      it.setAttribute('aria-hidden',on?'false':'true');
      it.inert=!on;
    });
    dotEls.forEach(function(d,i){d.setAttribute('aria-current',i===active?'true':'false');});
    live.textContent=plants[active].title+' ('+plants[active].latin+'), '+(active+1)+' of '+n;
  }

  function go(target,mode,dir){
    if(busy||target===active)return;
    busy=true;
    var oldTop=cards[active],newTop=cards[target];
    if(mode==='out'){
      oldTop.style.setProperty('--dir',dir);
      oldTop.classList.add('leaving');
      active=target;layout();
      setTimeout(function(){
        oldTop.classList.add('snap');
        oldTop.classList.remove('leaving');
        void oldTop.offsetWidth;
        oldTop.classList.remove('snap');
        busy=false;
      },DUR);
    }else{
      newTop.style.setProperty('--dir',-1);
      newTop.classList.add('entering','snap');
      void newTop.offsetWidth;
      newTop.classList.remove('snap');
      active=target;layout();
      newTop.classList.remove('entering');
      setTimeout(function(){busy=false;},DUR);
    }
  }
  var next=function(dir){go((active+1)%n,'out',dir||-1);};
  var prev=function(){go((active-1+n)%n,'in',-1);};

  document.getElementById('next').addEventListener('click',function(){next(-1);});
  document.getElementById('prev').addEventListener('click',prev);
  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight')next(-1);
    else if(e.key==='ArrowLeft')prev();
  });

  /* swipe / drag the top card */
  var drag=null;
  stage.addEventListener('pointerdown',function(e){
    if(busy||(e.pointerType==='mouse'&&e.button!==0))return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),dx:0,moving:false};
  });
  stage.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y,top=cards[active];
    if(!drag.moving){
      if(Math.abs(dx)<8)return;
      if(Math.abs(dy)>Math.abs(dx)*1.2){drag=null;return;}
      drag.moving=true;
      try{stage.setPointerCapture(e.pointerId);}catch(err){}
      top.classList.add('dragging');
    }
    drag.dx=dx;
    top.style.transform='translate('+dx+'px,'+(dy*.15)+'px) rotate('+(dx*.05)+'deg)';
  });
  function endDrag(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag,top=cards[active];
    drag=null;
    if(!d.moving)return;
    var v=Math.abs(d.dx)/Math.max(1,performance.now()-d.t);
    top.classList.remove('dragging');
    top.style.transform='';
    if(Math.abs(d.dx)>90||v>.6)next(d.dx<0?-1:1);
  }
  stage.addEventListener('pointerup',endDrag);
  stage.addEventListener('pointercancel',endDrag);
  stage.addEventListener('dragstart',function(e){e.preventDefault();});

  layout();
})();
</script>

</body>
</html>
